[package]
name = "qcapture-encode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
qcapture-core = { path = "../qcapture-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
flume = "0.11"
# Second ffmpeg stdin for mixed PCM: Windows named pipes, Unix sockets.
interprocess = "2"
