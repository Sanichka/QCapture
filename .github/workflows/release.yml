name: release

# Cut a release: git tag vX.Y.Z && git push origin vX.Y.Z
# (tag must match the workspace version in Cargo.toml).
on:
  push:
    tags:
      - "v*"
  # Manual re-run (e.g. retry packaging without moving the tag).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bins: qcapture.exe qcapture-widget.exe
            suffix: windows-x86_64
            ext: zip
            exe_suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bins: qcapture qcapture-widget
            suffix: linux-x86_64
            ext: tar.gz
            exe_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bins: qcapture qcapture-widget
            suffix: macos-aarch64
            ext: tar.gz
            exe_suffix: ""
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: qcapture-${{ github.ref_name }}-${{ matrix.suffix }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$TAG" = "$VER" || { echo "tag v$TAG != workspace $VER"; exit 1; }
      - name: Linux system deps (x11/winit, ALSA/cpal, D-Bus/accesskit)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config libdbus-1-dev libasound2-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libxkbcommon-dev libssl-dev
      - run: cargo build --release --locked -p qcapture-cli --target ${{ matrix.target }}
      - name: Stage package
        shell: bash
        run: |
          mkdir -p pkg
          for b in ${{ matrix.bins }}; do
            cp "target/${{ matrix.target }}/release/$b" pkg/
          done
          cp README.md pkg/
      # Zero-install ffmpeg on Windows/Linux: static 9.x builds bundled beside
      # the binaries (gyan / johnvansickle). macOS ships NO bundled ffmpeg —
      # no trustworthy Apple-Silicon static 9.x source exists (evermeet is
      # Intel-only), so mac users `brew install ffmpeg` (resolved via PATH).
      # The encoder smoke test gates win/linux: the job fails if the bundled
      # binary lacks our encoders.
      - name: Bundle ffmpeg (Windows: gyan 9.x essentials)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg-dl.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          7z x ffmpeg-dl.zip -offdl > /dev/null
          cp ffdl/*/bin/ffmpeg.exe "pkg/ffmpeg${{ matrix.exe_suffix }}"
          "pkg/ffmpeg${{ matrix.exe_suffix }}" -hide_banner -encoders | grep -E "h264_nvenc|h264_amf|h264_qsv|h264_videotoolbox|libx264" | head -8
      - name: Bundle ffmpeg (Linux: johnvansickle 9.x static)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg-dl.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          mkdir -p ffdl && tar -xJf ffmpeg-dl.tar.xz -C ffdl --wildcards '*/ffmpeg'
          cp ffdl/*/ffmpeg "pkg/ffmpeg${{ matrix.exe_suffix }}"
          chmod +x "pkg/ffmpeg${{ matrix.exe_suffix }}"
          "pkg/ffmpeg${{ matrix.exe_suffix }}" -hide_banner -encoders | grep -E "h264_nvenc|h264_amf|h264_qsv|h264_videotoolbox|libx264" | head -8
      - name: Third-party notice
        shell: bash
        run: |
          cat > pkg/THIRD-PARTY.txt <<'EOF'
          QCapture release bundle — third-party component:
          ffmpeg (https://ffmpeg.org, GPL-licensed static build) is bundled so no
          install is needed: gyan.dev essentials 9.x on Windows,
          johnvansickle.com static 9.x on Linux. macOS archives ship no ffmpeg —
          install it with `brew install ffmpeg` (resolved via PATH).
          ffmpeg sources: https://github.com/FFmpeg/FFmpeg
          EOF
      - name: Archive (zip on Windows)
        shell: bash
        run: |
          cd pkg
          if [[ "${{ matrix.os }}" == windows* ]]; then
            7z a "../${{ env.ARCHIVE }}" *
          else
            tar czf "../${{ env.ARCHIVE }}" *
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  publish:
    needs: build
    # Manual dispatches only verify packaging; tags publish the release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: pkgs
      # Explicit gh upload (with visible listing): the previous
      # softprops/action-gh-release step reported success while silently
      # attaching zero assets, twice in a row.
      - run: |
          ls -la pkgs
          # -R: the publish job has no checkout, so gh gets the repo explicitly.
          if ! gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" pkgs/qcapture-* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
