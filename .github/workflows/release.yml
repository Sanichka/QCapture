name: release

# Cut a release: git tag vX.Y.Z && git push origin vX.Y.Z
# (tag must match the workspace version in Cargo.toml).
on:
  push:
    tags:
      - "v*"
  # Manual re-run (e.g. retry packaging without moving the tag).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bins: qcapture.exe qcapture-widget.exe
            suffix: windows-x86_64
            ext: zip
            exe_suffix: .exe
            ffmpeg_wheel: https://files.pythonhosted.org/packages/2c/c6/fa760e12a2483469e2bf5058c5faff664acf66cadb4df2ad6205b016a73d/imageio_ffmpeg-0.6.0-py3-none-win_amd64.whl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bins: qcapture qcapture-widget
            suffix: linux-x86_64
            ext: tar.gz
            exe_suffix: ""
            ffmpeg_wheel: https://files.pythonhosted.org/packages/a0/2d/43c8522a2038e9d0e7dbdf3a61195ecc31ca576fb1527a528c877e87d973/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl
          - os: macos-latest
            target: aarch64-apple-darwin
            bins: qcapture qcapture-widget
            suffix: macos-aarch64
            ext: tar.gz
            exe_suffix: ""
            ffmpeg_wheel: https://files.pythonhosted.org/packages/40/5c/f3d8a657d362cc93b81aab8feda487317da5b5d31c0e1fdfd5e986e55d17/imageio_ffmpeg-0.6.0-py3-none-macosx_11_0_arm64.whl
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: qcapture-${{ github.ref_name }}-${{ matrix.suffix }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$TAG" = "$VER" || { echo "tag v$TAG != workspace $VER"; exit 1; }
      - name: Linux system deps (x11/winit, ALSA/cpal, D-Bus/accesskit)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config libdbus-1-dev libasound2-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libxkbcommon-dev libssl-dev
      - run: cargo build --release --locked -p qcapture-cli --target ${{ matrix.target }}
      - name: Stage package
        shell: bash
        run: |
          mkdir -p pkg
          for b in ${{ matrix.bins }}; do
            cp "target/${{ matrix.target }}/release/$b" pkg/
          done
          cp README.md pkg/
      - name: Bundle ffmpeg (pinned static build, zero-install)
        shell: bash
        run: |
          curl -sSL -o ffmpeg-dl.whl "${{ matrix.ffmpeg_wheel }}"
          PY="$(command -v python3 || command -v python)"
          "$PY" -c "import zipfile; z = zipfile.ZipFile('ffmpeg-dl.whl'); ns = [n for n in z.namelist() if '/binaries/ffmpeg-' in n and not n.endswith('/')]; assert len(ns) == 1, ns; z.extract(ns[0], 'ffx'); print(ns[0])"
          cp "ffx/imageio_ffmpeg/binaries/ffmpeg-"* "pkg/ffmpeg${{ matrix.exe_suffix }}"
          chmod +x "pkg/ffmpeg${{ matrix.exe_suffix }}"
          "pkg/ffmpeg${{ matrix.exe_suffix }}" -hide_banner -encoders | grep -E "h264_nvenc|h264_amf|h264_qsv|h264_videotoolbox|libx264" | head -8
          cat > pkg/THIRD-PARTY.txt <<'EOF'
          QCapture release bundle — third-party component:
          ffmpeg (https://ffmpeg.org, GPL-licensed static build) is bundled so no
          install is needed. Shipped via imageio-ffmpeg 0.6.0 wheels
          (https://github.com/imageio/imageio-ffmpeg, BSD-2-Clause).
          ffmpeg sources: https://github.com/FFmpeg/FFmpeg
          EOF
      - name: Archive (zip on Windows)
        shell: bash
        run: |
          cd pkg
          if [[ "${{ matrix.os }}" == windows* ]]; then
            7z a "../${{ env.ARCHIVE }}" *
          else
            tar czf "../${{ env.ARCHIVE }}" *
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  publish:
    needs: build
    # Manual dispatches only verify packaging; tags publish the release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: pkgs
      # Explicit gh upload (with visible listing): the previous
      # softprops/action-gh-release step reported success while silently
      # attaching zero assets, twice in a row.
      - run: |
          ls -la pkgs
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" pkgs/qcapture-* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
